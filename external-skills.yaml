# External Skills Manifest
#
# Skills fetched from external sources (git repos, etc.), plus in-repo skills
# listed as `type: internal`. This file is shared and public: machine-specific
# or private-access skills belong in local.yaml.
#
# Run `scripts/sync.sh` to fetch/update.
#
# Types:
#   - git: Clone from remote repo
#   - internal: Skill source is tracked in this repository
#
# Structure: All skills sync to skills/<name>/

skills:
  - name: skill-creator
    type: git
    description: Anthropic's official skill creator for building Claude skills
    source: https://github.com/anthropics/skills.git
    branch: main
    path: skills/skill-creator
    target: skills/skill-creator

  # === Internal skills (in-repo, no sync needed) ===
  - name: ai-client-config
    type: internal
    description: AI coding client configuration paths and setup

  - name: ai-repo-management
    type: internal
    description: AI repository structure management and validation

  - name: skill-promotion
    type: internal
    description: Promote validated memory observations into reusable skills

  # - name: mcp-builder
  #   type: git
  #   description: MCP server builder skill
  #   source: https://github.com/anthropics/skills.git
  #   branch: main
  #   path: skills/mcp-builder
  #   target: skills/mcp-builder

  # === AntVis Infographic skills (external, git-synced) ===
  - name: infographic-creator
    type: git
    description: Generate complete infographic HTML files with AntVis engine
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-creator
    target: skills/infographic-creator

  - name: infographic-syntax-creator
    type: git
    description: Convert descriptions to AntVis infographic DSL syntax
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-syntax-creator
    target: skills/infographic-syntax-creator

  - name: infographic-structure-creator
    type: git
    description: Design custom infographic structural layouts
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-structure-creator
    target: skills/infographic-structure-creator

  - name: infographic-item-creator
    type: git
    description: Generate custom infographic component designs
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-item-creator
    target: skills/infographic-item-creator

  - name: infographic-template-updater
    type: git
    description: Extend the AntVis infographic template library
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-template-updater
    target: skills/infographic-template-updater
