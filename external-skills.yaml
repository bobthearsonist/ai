  # === AntVis Infographic skills (external, git-synced) ===
  - name: infographic-creator
    type: git
    description: Generate complete infographic HTML files with AntVis engine
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-creator
    target: skills/infographic-creator

  - name: infographic-syntax-creator
    type: git
    description: Convert descriptions to AntVis infographic DSL syntax
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-syntax-creator
    target: skills/infographic-syntax-creator

  - name: infographic-structure-creator
    type: git
    description: Design custom infographic structural layouts
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-structure-creator
    target: skills/infographic-structure-creator

  - name: infographic-item-creator
    type: git
    description: Generate custom infographic component designs
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-item-creator
    target: skills/infographic-item-creator

  - name: infographic-template-updater
    type: git
    description: Extend the AntVis infographic template library
    source: https://github.com/antvis/Infographic.git
    branch: main
    path: skills/infographic-template-updater
    target: skills/infographic-template-updater

  # === Obsidian's official agent skills (external, git-synced) ===
  # Also published as plugin `obsidian` in the obsidian-skills marketplace.
  - name: obsidian-markdown
    type: git
    description: Obsidian Flavored Markdown - wikilinks, embeds, callouts, properties
    source: https://github.com/obsidianmd/obsidian-skills.git
    branch: main
    path: plugins/obsidian/skills/obsidian-markdown
    target: skills/obsidian-markdown
    plugin: obsidian

  - name: obsidian-bases
    type: git
    description: Obsidian Bases (.base) views, filters, formulas and summaries
    source: https://github.com/obsidianmd/obsidian-skills.git
    branch: main
    path: plugins/obsidian/skills/obsidian-bases
    target: skills/obsidian-bases
    plugin: obsidian

  - name: json-canvas
    type: git
    description: JSON Canvas (.canvas) files with nodes, edges and groups
    source: https://github.com/obsidianmd/obsidian-skills.git
    branch: main
    path: plugins/obsidian/skills/json-canvas
    target: skills/json-canvas
    plugin: obsidian

  - name: obsidian-cli
    type: git
    description: Working with vaults through the Obsidian CLI
    source: https://github.com/obsidianmd/obsidian-skills.git
    branch: main
    path: plugins/obsidian/skills/obsidian-cli
    target: skills/obsidian-cli
    plugin: obsidian
