name: AGENTS.md evals

# Runs the agents-md eval suite when AGENTS.md, the evals or this workflow
# change. On a pull request the candidate AGENTS.md is compared with the base
# branch's; after a merge, with the commit before the push. The job always runs
# and skips cheaply when nothing relevant changed, so it can be a required check
# without leaving unrelated pull requests waiting.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-md-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agents-md:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base=$(git merge-base "$PR_BASE" HEAD)
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then base="$PUSH_BEFORE"
          else base=""; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -z "$base" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -qE '^(AGENTS\.md|evals/|\.github/workflows/agents-md-evals\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to AGENTS.md, evals/ or this workflow; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for the Claude credential
        id: secret
        if: steps.scope.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            # Fork pull requests never receive secrets; anything else is a setup error.
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "Fork pull request: secrets are unavailable, live evals skipped." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is not set"; exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evals/package-lock.json

      # The lockfile records the engine as git+ssh; runners have no SSH key.
      - name: Fetch GitHub dependencies over HTTPS
        if: steps.scope.outputs.run == 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install and test offline
        if: steps.scope.outputs.run == 'true'
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Run live evals
        if: steps.scope.outputs.run == 'true' && steps.secret.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          # A below-threshold exit is expected (the pass threshold is 1.0); the
          # gate below decides the outcome from per-case verdicts.
          if [ -n "$BASE" ]; then baseline=(--baseline "$BASE"); else baseline=(); fi
          npm run eval:agents-md -- run "${baseline[@]}" --model sonnet --approve-sessions 30 --concurrency 3 || true

      - name: Gate on regressions
        if: steps.scope.outputs.run == 'true' && steps.secret.outputs.present == 'true'
        run: node local/gate.mjs

      - name: Keep the run archive
        if: always() && steps.scope.outputs.run == 'true' && steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agents-md-evals
          path: evals/.work/local-runs/
          retention-days: 30
